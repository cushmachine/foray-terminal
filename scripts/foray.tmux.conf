# Foray's own tmux config, applied only to Foray's own server (passed with
# -f by scripts/tmux-server.sh). Never written to ~/.tmux.conf or applied to
# any other tmux server on the machine.

# Scrollback comes from tmux history, served as HTML to the browser.
set -g mouse off
set -g history-limit 10000
# Modified keys (Shift+Enter in Claude Code) reach the pane as CSI u instead
# of being downgraded to a plain Enter. applyTmuxServerOptions() in
# src/server/tmux.ts re-asserts these same two settings at the running
# server as a belt to this brace (tmux honours -f only when it starts the
# server, so a lost race on macOS, which has no unit, would otherwise leave
# them unset silently) — keep the values identical; a test ties the two
# together.
set -s extended-keys always
set -s extended-keys-format csi-u
