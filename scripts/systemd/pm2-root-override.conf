# Drop-in for pm2-root.service, installed by scripts/ensure-tmux-unit.sh.
# The default OOMPolicy=stop tears the whole unit down when any process in
# its cgroup is OOM-killed; on 2026-09-08 that took the tmux server (then
# still under pm2) and every nest session with it. Sessions now live in
# nest-tmux.service, but keep pm2 itself from self-destructing too.
[Service]
OOMPolicy=continue
