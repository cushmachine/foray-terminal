# Drop-in for pm2-<user>.service — the unit systemd creates for whichever
# account runs pm2 (pm2-foray.service for the dedicated user SECURITY.md
# recommends). Installed by scripts/ensure-tmux-unit.sh at
# /etc/systemd/system/pm2-<user>.service.d/.
#
# The default OOMPolicy=stop tears the whole unit down when any process in
# its cgroup is OOM-killed — which once took the tmux server (then still
# under pm2) and every Foray session with it. Sessions now live in their
# own unit (see foray-tmux.service), but keep pm2 itself from
# self-destructing too.
[Service]
OOMPolicy=continue
