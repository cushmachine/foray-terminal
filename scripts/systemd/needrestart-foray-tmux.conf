# Keep needrestart's hands off the tmux server that holds every Foray
# session.
#
# 2026-09-09 06:10: an unattended perl security upgrade ran, needrestart
# then did `systemctl restart nest-tmux.service` (renamed foray-tmux.service
# since) and killed every session. Restarting this unit never helps (it
# holds user sessions, not a daemon that benefits from a fresh binary), so
# always skip it.
# Installed to /etc/needrestart/conf.d/ by scripts/ensure-tmux-unit.sh.
$nrconf{override_rc}{qr(^foray-tmux)} = 0;
