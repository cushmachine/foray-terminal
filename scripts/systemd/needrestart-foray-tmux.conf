# Keep needrestart's hands off the tmux server that holds every Foray
# session.
#
# needrestart runs after unattended-upgrades and restarts every unit whose
# libraries were replaced — a routine perl security upgrade is enough to
# pick this one up. `systemctl restart` here kills every session in the
# unit, and it never helps: the unit holds user sessions, not a daemon that
# benefits from a fresh binary. Always skip it.
# Installed to /etc/needrestart/conf.d/ by scripts/ensure-tmux-unit.sh.
$nrconf{override_rc}{qr(^foray-tmux)} = 0;
